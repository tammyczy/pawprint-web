<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓝老步态逐帧检查</title>
<style>body{margin:0;background:#f5f3ed;color:#283b32;font:15px system-ui}header{padding:18px 24px}h1{font-size:22px;margin:0 0 8px}p{margin:6px 0;color:#606b61}nav{display:flex;gap:10px;align-items:center;margin-top:14px}button,select{font:inherit;padding:8px;border:1px solid #bbc5b9;border-radius:5px;background:white;color:inherit}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}.panel{border:1px solid #cdd3c8}h2{font-size:17px;margin:12px}.view{height:430px}.view canvas{display:block;width:100%;height:100%}.readout{padding:10px 12px;font:13px ui-monospace,monospace;min-height:38px}.legend{padding:14px 24px;display:flex;gap:24px}.fl{color:#1876b9}.fr{color:#695ac8}.hl{color:#bc7415}.hr{color:#c63f4c}</style>
<header><h1>蓝老步态逐帧检查</h1><p>同一模型与蒙皮。观察换速时的后腿落地顺序；彩色点表示脚掌位置。</p><nav><label>动作 <select id="motion"><option value="transition">反复换速</option><option value="trot">小跑</option><option value="gallop">疾跑</option><option value="turn">转弯</option></select></label><label>视角 <select id="view"><option value="side">侧面</option><option value="rear">后侧</option><option value="front">正面</option></select></label><label>播放速度 <select id="rate"><option value=".25">四分之一速</option><option value=".5">半速</option><option value="1">正常速度</option></select></label><button id="pause">暂停</button><button id="step">前进一帧</button><button id="reset">重播</button><span id="time">载入中</span></nav></header>
<main><section class="panel"><h2>修改前</h2><div id="before" class="view"></div><div id="before-readout" class="readout"></div></section><section class="panel"><h2>修改后</h2><div id="after" class="view"></div><div id="after-readout" class="readout"></div></section></main>
<div class="legend"><span class="fl">● 左前</span><span class="fr">● 右前</span><span class="hl">● 左后</span><span class="hr">● 右后</span></div>
<script type="module" src="./viewer.js"></script></html>
